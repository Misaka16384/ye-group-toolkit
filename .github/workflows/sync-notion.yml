name: Sync YE Group Toolkit from Notion

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 自动同步一次
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export Notion Toolkit to Markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: Commit and push if content changed
        run: |
          if [ -n "$(git status --porcelain kb/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add kb/
            git commit -m "chore(kb): sync YE Group Toolkit from Notion"
            git push
          else
            echo "No changes detected in kb/."
          fi
